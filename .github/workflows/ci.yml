name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + coverage gate (fails below 80% on the covered modules, see pyproject.toml)
        run: pytest -q --cov --cov-report=term-missing
      - name: Smoke test - generate a small dataset end to end
        working-directory: uav_dataset
        run: |
          python make_dataset.py quick
          test -s data/sweep_train.csv
          test -s data/altitude_check.png

  rl-smoke:
    name: rl smoke test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-rl.txt pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - name: RL tests (includes a short PPO training run)
        run: pytest -q uav_dataset/test_rl.py
