# UAV-NOMA dataset config. Every dataset version = this file + the seeds below.
# Change values HERE, never inside the code.

area_m: 1000            # square side

# Each scenario (seed) draws its own values from these ranges (domain randomization).
n_users_choices: [100, 300, 600, 1000]   # must be even (NOMA pairs)
n_clusters_range: [2, 5]                 # inclusive
cluster_radius_range_m: [50, 200]
scatter_fraction_range: [0.05, 0.10]     # isolated users spread over the whole area

# user classes: share of users and minimum rate to count as "covered" (bits/s).
# Class mix is from the project spec example; the min rates are ENGINEERING ASSUMPTIONS
# (no source yet) - give each a sensitivity range before using results in the report.
classes:
  rescue: {share: 0.10, min_rate_bps: 200000}
  video:  {share: 0.20, min_rate_bps: 500000}
  voice:  {share: 0.30, min_rate_bps: 50000}
  iot:    {share: 0.20, min_rate_bps: 10000}
  normal: {share: 0.20, min_rate_bps: 100000}

# seeds: separate lists so train / validation / test never overlap
seeds_train: [0, 99]            # inclusive range -> 100 scenarios
seeds_val:   [100, 119]         # 20 scenarios
seeds_test:  [120, 139]         # 20 scenarios

# mobility (Phase 3). Each scenario draws one model; all speeds are walking speeds (engineering assumptions).
mobility:
  dt_s: 1.0
  episode_steps: 300            # 300 s of movement
  store_every_steps: 30         # trajectory snapshot every 30 s -> 11 snapshots per scenario
  choices: [random_waypoint, group_drift, attraction, hotspot_jump, surge]
  speed_mps: [0.5, 1.5]
  group_jitter_mps: 0.3         # group_drift: per-user random wobble around the group
  n_shelters_range: [1, 2]      # attraction: users walk to the nearest shelter
  arrival_radius_m: 20          # attraction: users stop within this radius of the shelter
  # harder dynamics (engineering assumptions): sudden events that a fixed drone handles badly
  surge_speed_mps: 3.0          # surge / hotspot_jump: panicked fast walking or running
  surge_start_range_s: [60, 180]  # when the sudden event starts (users are still before that)
  surge_radius_m: 60            # surge: users pile up within this radius of the new point

# radio
fc_hz: 2000000000
bandwidth_per_user_hz: 50000    # total bandwidth = n_users x this (200 users -> 10 MHz); keeps per-user rates comparable
noise_density_dbm_hz: -174
noise_figure_db: 7
tx_power_dbm_levels: [0, 10, 20, 30]   # TOTAL power, shared by all users

# air-to-ground channel, urban (Al-Hourani et al.) - VERIFY against the paper
a2g:
  a: 9.61
  b: 0.16
  eta_los_db: 1.0
  eta_nlos_db: 20.0

# obstacles = collapsed-building rectangles (Phase 4). A drone-user link that crosses one gets extra loss.
obstacles:
  n_range: [0, 5]               # inclusive; drawn per scenario
  size_range_m: [40, 150]       # width and height of each rectangle
  excess_loss_db: 15.0          # ENGINEERING ASSUMPTION: extra loss on a blocked link (sensitivity range 10-25)

# small-scale fading (Phase 4). Off = average channel (deterministic baselines, dataset sweep).
fading:
  enabled: false
  rician_k_db: 10.0             # ENGINEERING ASSUMPTION: LoS link K-factor; NLoS links use Rayleigh

# NOMA
noma_alpha_weak: 0.8            # power share of the weak user (strong gets 0.2)
pairing: extreme                # extreme (strongest with weakest) | random

# QoS-aware access (book 14.6 step 2), used only when env.access is oma_opt or noma_opt (make_dataset.access_rates).
# Every admitted user gets just its class's min rate at minimum power; the cheapest users are admitted first.
access:
  sic_eps: 0.0                  # ENGINEERING ASSUMPTION: imperfect-SIC residual (share of the weak user's power the
                                # strong user cannot remove); 0 = perfect SIC; sensitivity {0, 0.05}; noma_opt only
  rescue_first: false           # true = admit rescue users first, then the rest (lexicographic); default off

# sweep of drone positions
sweep:
  xy_step_m: 100                # 11 x 11 grid on 1000 m (use 50 for a finer 21 x 21)
  altitudes_m: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 800, 1000]  # plan's h_max is 300-500 m; above that is diagnostic only

# energy: rotary-wing propulsion (Zeng, Xu, Zhang) - VERIFY every value against the paper before citing
energy:
  dt_s: 1.0
  P0_w: 79.86                   # blade profile power in hover
  Pi_w: 88.63                   # induced power in hover  (hover = P0 + Pi = 168.49 W)
  Utip_mps: 120.0               # rotor tip speed
  v0_mps: 4.03                  # mean rotor induced velocity in hover
  d0: 0.6                       # fuselage drag ratio
  rho_kg_m3: 1.225              # air density
  s: 0.05                       # rotor solidity
  A_m2: 0.503                   # rotor disc area
  weight_n: 20.0                # UAV weight (Zeng's value); used for the climbing term
  P_circuit_w: 5.0              # ENGINEERING ASSUMPTION: on-board electronics
  pa_efficiency: 0.4            # ENGINEERING ASSUMPTION: power-amplifier efficiency, comm power = P_tx / this
  battery_wh: 10.0              # small on purpose: ~3.5 min of hover, so the battery binds in a 300 s episode

# UAV limits (spec values; engineering assumptions)
uav:
  v_max_mps: 15.0               # max horizontal speed
  vz_max_mps: 5.0               # max vertical speed
  h_min_m: 50.0
  h_max_m: 300.0                # the sweep goes above this for diagnostics only
  start_h_m: 150.0
  p_max_dbm: 30.0

# Gymnasium env (Phase 5)
env:
  grid: 10                      # NxN user-density heatmap
  access: noma                  # noma | oma | oma_opt | noma_opt: how users share the radio (OMA = FDMA, same total
                                # bandwidth and power); *_opt = QoS-aware minimum-power admission (see `access:`)
  reward: v2                    # v1 = coverage;  v2 = coverage - lambda_E * (energy_step / hover_energy_step)
  lambda_energy: 0.05           # ENGINEERING ASSUMPTION
  terminal_penalty: 1.0         # battery empty: reward -= penalty * share of users left uncovered

# Baselines (Gate G3). B0 fixed, B1 follow the biggest crowd, B2 weighted k-means, B3 grid search, B4 PSO, B5 energy-aware.
baselines:
  eval_seeds: [0, 99]           # inclusive: 100 scenarios (the plan's G3 minimum)
  altitude_m: 150               # fixed altitude for B0, B1, B2, B3, B5
  power_frac: 1.0               # 1.0 = full power (action +1) for every baseline except B4 (which searches it)
  replan_every_steps: 10        # K: how often B2, B3, B4, B5 recompute their target
  kmeans_k: 3                   # B2: number of clusters
  kmeans_iters: 20
  rescue_weight: 3.0            # B2: a rescue user counts this much more than a normal user
  grid_n: 10                    # B3, B5, B6: grid_n x grid_n candidate positions (100 candidates)
  altitude_levels_m: [50, 100, 150, 200, 300]   # B6: altitudes tried at every grid position
  pso: {particles: 12, iters: 10, inertia: 0.7, c1: 1.5, c2: 1.5}
  energy_aware_margin: 1.0      # B5 moves only if (coverage gain x K) > margin x extra energy cost (in reward units)
  # B3obs / B3obsU / B3obsUO (information ladder): B3's search, but scored on a pseudo-crowd rebuilt from the maps.
  obs_pseudo_users: 500         # ENGINEERING ASSUMPTION: crowd size they assume (mean of n_users_choices; must be even)

# Named profiles = overrides of the settings above. Select with UAV_PROFILE=<name> or `--profile <name>`.
# They exist because in the default scenarios a fixed drone already covers 88% of users, which leaves RL little to gain.
# All values are engineering choices. Nothing here changes the default dataset.
profiles:
  lowpower:                      # weaker transmitter: position and altitude matter more
    uav: {p_max_dbm: 20}
  bigarea:                       # 2 x 2 km (the plan's out-of-distribution size): the centre no longer covers everyone
    area_m: 2000
  rl_static:                     # RL curriculum step 1: as hard as `hard`, but the crowd stands still
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [static]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
  rl_static_g20:                 # same scenarios as rl_static, but the agent's map is 20 x 20 instead of 10 x 10
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [static]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
    env: {grid: 20}
  hard:                          # everything at once, plus dynamic-only mobility models and a battery that can last
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [hotspot_jump, surge, group_drift, attraction]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}      # keep the grid spacing about the same on the bigger map

# Reinforcement learning (Gate G4). Train on the training seeds only; pick models on val; touch test once at the end.
rl:
  algo: PPO
  profile: rl_static             # which scenario profile to train on
  hold_steps: 10                 # the agent decides once every 10 s (like the baselines)
  controls: goto                 # curriculum: goto (where to fly) -> gotoz (+ altitude) -> gotozp (+ power); xy/xyz/xyzp = velocity versions
  reward: v1                     # v1 = coverage only; v2 adds the energy cost (curriculum step 5)
  seed: 0
  total_timesteps: 100000        # agent DECISIONS (each held hold_steps seconds): 100k decisions = 1M seconds
  n_envs: 4
  n_steps: 256                   # decisions per env per update
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995                   # kept from the 1-step setup; with hold_steps 10 a game is only 30 decisions (book 14.5)
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
  policy: mlp                    # mlp = plain network on the observation | cnn = reads the two maps as a picture
  obs_groups: [pos, vel, battery, time, prev, heat_all, heat_rescue]   # what the agent sees (all = 211 numbers)
  std_end: null                  # if a number, the exploration noise shrinks linearly from exp(log_std_init) to it (e.g. 0.05)
  log_std_init: -1.0             # start with action noise of about 0.37 (SB3 default 0 = 1.0, too noisy here)
  norm_reward: true              # scale rewards (returns are ~150): standard for PPO value learning
  val_eval_every_steps: 20000    # (decisions) print a deterministic score on the first val scenarios during training
  val_eval_scenarios: 8
  checkpoint_every_steps: 10000
  out_dir: results/rl
