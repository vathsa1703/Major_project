# UAV-NOMA dataset config. Every dataset version = this file + the seeds below.
# Change values HERE, never inside the code.

area_m: 1000            # square side

# Each scenario (seed) draws its own values from these ranges (domain randomization).
n_users_choices: [100, 300, 600, 1000]   # must be even (NOMA pairs)
n_clusters_range: [2, 5]                 # inclusive
cluster_radius_range_m: [50, 200]
scatter_fraction_range: [0.05, 0.10]     # isolated users spread over the whole area

# user classes: share of users and minimum rate to count as "covered" (bits/s).
# Class mix is from the project spec example; the min rates are ENGINEERING ASSUMPTIONS
# (no source yet) - give each a sensitivity range before using results in the report.
classes:
  rescue: {share: 0.10, min_rate_bps: 200000}
  video:  {share: 0.20, min_rate_bps: 500000}
  voice:  {share: 0.30, min_rate_bps: 50000}
  iot:    {share: 0.20, min_rate_bps: 10000}
  normal: {share: 0.20, min_rate_bps: 100000}

# seeds: separate lists so train / validation / test never overlap
seeds_train: [0, 99]            # inclusive range -> 100 scenarios
seeds_val:   [100, 119]         # 20 scenarios
seeds_test:  [120, 139]         # 20 scenarios

# mobility (Phase 3). Each scenario draws one model; all speeds are walking speeds (engineering assumptions).
mobility:
  dt_s: 1.0
  episode_steps: 300            # 300 s of movement
  store_every_steps: 30         # trajectory snapshot every 30 s -> 11 snapshots per scenario
  choices: [random_waypoint, group_drift, attraction, hotspot_jump, surge]
  speed_mps: [0.5, 1.5]
  group_jitter_mps: 0.3         # group_drift: per-user random wobble around the group
  n_shelters_range: [1, 2]      # attraction: users walk to the nearest shelter
  arrival_radius_m: 20          # attraction: users stop within this radius of the shelter
  # harder dynamics (engineering assumptions): sudden events that a fixed drone handles badly
  surge_speed_mps: 3.0          # surge / hotspot_jump: panicked fast walking or running
  surge_start_range_s: [60, 180]  # when the sudden event starts (users are still before that)
  surge_radius_m: 60            # surge: users pile up within this radius of the new point

# Competing sites (D-52 scenario redesign). Used ONLY when a scenario's mobility model is `sites` (the sites_* profiles
# below); every other scenario ignores this section, so the old datasets and results are bit-exact.
# The crowd lives at 2-3 sites. Site A holds most of the active demand at the start; at t0 a share s of the ACTIVE
# demand moves from A to site B, which is distance_m away, ramped linearly over tau_s seconds: the k-th mover of A
# becomes inactive and its twin at B (same class) becomes active at t0 + tau_s * k / n_move, so the number of active
# users (and the demand mix) never changes. Inactive users leave the coverage denominator and get no radio resources;
# the total bandwidth stays the scenario's n_users x bandwidth_per_user_hz (n_users = active users).
# Default event reading: a shelter opening at B (people are taken from A to B by a rescue operation; the trip itself is
# not simulated, they leave A's demand and appear at B). The same mechanism also stands for a ground tower restored at A
# while survivors are found at B. All numbers are ENGINEERING ASSUMPTIONS (D-52 design grid where noted).
sites:
  event: shelter_opening        # documentation label only (one mechanism, see above)
  n_sites_range: [2, 3]         # inclusive (D-52); site C (if any) never takes part in the event
  distance_m: 1500              # A-B distance D (D-52 grid {1000, 1500, 2000}); exact, both sites inside the map
  tau_s: 60                     # ramp duration of the move (D-52 grid {0, 60, 180}); 0 = abrupt
  announced: false              # D-52 grid {announced, unannounced}: only feeds the `event_countdown` observation
  t0_range_s: [60, 150]         # event start, uniform, whole seconds (D-52)
  share_range: [0.5, 0.7]       # share s of the active demand that moves, uniform (D-52)
  radius_range_m: [50, 150]     # site radius, uniform per site; users truncated-Gaussian (std radius/2) inside it
  min_separation_m: 400         # site C is at least this far from A and B
  site_weight_concentration: 3.0  # Dirichlet weights of the non-moving active users over the sites
  speed_mps: [0.0, 1.0]         # walking inside the own site (random waypoint in the site disc), drawn per leg
  burst_prob: 0.05              # chance that a leg is a burst (hurrying) ...
  burst_speed_mps: [1.0, 3.0]   # ... at this speed; 3 m/s is the cap for every user (D-52)
  max_draws: 256                # rejection-sampling batch for site placement (deterministic, seeded)

# Real-place case study (book: case study "Kathmandu, Bagmati floods"; docs/case_nepal/). Used ONLY when a scenario's
# mobility model is `place` (profile place_kathmandu_bagmati); every other scenario ignores these two sections, so the
# old datasets and results are bit-exact. Map data (c) OpenStreetMap contributors, ODbL 1.0 (osm_place.py downloads it
# once; the processed file places/<name>.json is committed). The crowd is RECONSTRUCTED from the map with the
# assumptions below: "a scenario based on ...", never "real data" (survivor positions are not published anywhere).
places:
  kathmandu_bagmati:
    title: a scenario based on the September 2024 Kathmandu (Bagmati river) floods
    centre_deg: [27.6900, 85.3070]   # Teku / Kuleshwor reach of the Bagmati (Balkhu at the west edge, Thapathali at
                                     # the east edge); the box is side_m x side_m around this centre
    side_m: 2000                     # = area_m of the profile
    rivers: [Bagmati]                # waterway names (OSM name or name:en) that define the flood band
place:
  name: kathmandu_bagmati
  levels_m: 3.0                 # ENGINEERING ASSUMPTION: storey height for building:levels (range 2.8-3.5 m)
  default_height: empirical     # buildings without a height/levels tag: `empirical` = drawn from the tagged buildings
                                # of the same box (if at least min_tagged), else uniform in default_height_range_m
  min_tagged: 100
  default_height_range_m: [6, 12]   # ENGINEERING ASSUMPTION (2-4 storeys), used only if too few buildings are tagged
  max_plausible_height_m: 45    # ENGINEERING ASSUMPTION (data cleaning): a tag above this (15 storeys) is treated as a
                                # tagging error and refilled like a missing height (Kathmandu box: one 25-storey tag)
  height_seed: 0                # seed of the missing-height draws (fixed: the city does not change between scenarios)
  raster_m: 2.0                 # ENGINEERING CHOICE: height-raster cell (range 1-5 m); also the ray sampling step
  los_model: geometric          # geometric = the ray test REPLACES Al-Hourani's P_LoS: clear -> eta_LoS, blocked ->
                                # eta_NLoS (a2g section). statistical = Al-Hourani's mean loss kept + obstacles.
                                # excess_loss_db on a blocked ray (the rectangle rule; sensitivity only)
  dist_grid_m: 10.0             # ENGINEERING CHOICE: river-distance field computed exactly every 10 m, bilinear between
  display_simplify_m: 1.0       # DISPLAY ONLY (3D page): footprint simplification tolerance, m
  display_max_buildings: null   # DISPLAY ONLY: cap on 3D footprints (largest first); null = all
  user_height_m: 1.5           # ENGINEERING ASSUMPTION: handset height above the ground or the roof it stands on
  # Flood and people (all ENGINEERING ASSUMPTIONS; no satellite flood map is used)
  flood_band_m: 200             # "flooded" = within this distance of the river centreline (sensitivity 150-300)
  dry_ring_m: 300               # "higher/drier ground just outside": band edge .. band edge + this
  n_users_choices: [300, 600, 1000]
  stranded_share_range: [0.3, 0.5]    # on rooftops of buildings inside the flood band (z = roof + user_height_m)
  shelter_share_range: [0.2, 0.4]     # at dry shelter candidates (open ground within shelter_radius_m)
  scatter_fraction_range: [0.05, 0.10]  # open ground anywhere outside the band; the rest = dry-ground groups
  dry_groups_range: [2, 4]            # dry-ground gatherings (Gaussian, std dry_group_std_m, on open ground)
  dry_group_std_m: [40, 100]
  shelter_radius_m: 60
  shelter_max_dist_m: 600       # shelters used by the crowd: dry candidates at most this far beyond the band edge
  n_shelters_max: 4             # the crowd uses at most this many dry shelters (the largest-weight ones)
  shelter_kinds: [school, college, university, hospital, community_centre, assembly_point, park, place_of_worship]
  stranded_rescue_share: 0.40   # share of class `rescue` among stranded users (range 0.2-0.6); others: base class mix
  # Evacuation event (the competing-sites mechanism of D-52: the boat trip itself is not simulated): from t0 a share of
  # the stranded users is taken to the NEAREST used shelter; mover k switches at t0 + tau * k / n_move.
  event: true
  t0_range_s: [60, 150]
  tau_s: 120
  evac_share_range: [0.3, 0.6]

# radio
fc_hz: 2000000000
bandwidth_per_user_hz: 50000    # total bandwidth = n_users x this (200 users -> 10 MHz); keeps per-user rates comparable
noise_density_dbm_hz: -174
noise_figure_db: 7
tx_power_dbm_levels: [0, 10, 20, 30]   # TOTAL power, shared by all users

# air-to-ground channel, urban (Al-Hourani et al.) - VERIFY against the paper
a2g:
  a: 9.61
  b: 0.16
  eta_los_db: 1.0
  eta_nlos_db: 20.0

# obstacles = collapsed-building rectangles (Phase 4). A drone-user link that crosses one gets extra loss.
obstacles:
  n_range: [0, 5]               # inclusive; drawn per scenario
  size_range_m: [40, 150]       # width and height of each rectangle
  excess_loss_db: 15.0          # ENGINEERING ASSUMPTION: extra loss on a blocked link (sensitivity range 10-25)

# Model mismatch ("the AI helps when reality does not match the textbook model"; results/mismatch/). ALL OFF by default:
# with these defaults the game is the old one, bit for bit. When on, the TRUE world (env.step: who is really served;
# the radio layer allocates with the true gains, as a base station that measures its channels) differs from the
# NOMINAL textbook model above (Al-Hourani mean path loss + obstacles.excess_loss_db on the known buildings), which the
# model-based pilots (B3, B6, ...) keep using to plan (env.evaluate(model="nominal")). Every value is an ENGINEERING
# ASSUMPTION (no primary source verified; to read: 3GPP TR 36.777 Annex B, TR 38.901 shadow fading, Al-Hourani et al.
# Globecom 2014). Each perturbation has its own rng stream (scenario seed, stream, draw).
# (c) "true Al-Hourani parameters of another environment class" is NOT built: the project has not verified any
# (a, b, eta_LoS, eta_NLoS) row besides the one above (docs/assumptions.md), so there is no sourced value to use.
mismatch:
  draw: 0                       # perturbation draw id: 1, 2, ... re-draw every perturbation of a scenario (check that
                                # a policy did not memorise one map)
  shadow_sigma_db: 0.0          # (a) user-side correlated log-normal shadowing, std at grazing elevation (dB);
                                # std(theta) = sigma * (1 - theta/90). Room grid {0, 4, 8}; range 0-12
  shadow_corr_m: 50.0           # correlation length of the user-side field (m; correlation 1/e at this distance).
                                # Room grid {25, 50, 150}; range 10-200
  shadow_res_frac: 0.25         # ENGINEERING CHOICE: field grid spacing = corr x this (bilinear interpolation)
  excess_loss_db: null          # (b) TRUE loss of a blocked link (dB); null = the planner's obstacles.excess_loss_db.
                                # Room grid {25} vs the nominal 15; range 10-30
  hidden_obstacles: 0           # (d) extra buildings in the true world only (absent from the planner's map), same
                                # size range as obstacles. Room grid {0, 2, 4}

# Off-grid refinement (pattern search) for B6r / B6true and the measured search of B6meas (reviewer amendment 2:
# so a continuous-action AI cannot win by grid resolution alone). ENGINEERING CHOICES.
refine:
  steps_m: [100, 50, 25]        # horizontal probe distances, coarse to fine; altitude probes are half of these
  max_moves_per_step: 20        # cap on improving moves at one probe distance (B6r / B6true only)

# B6meas (learning-free adaptive baseline, level 1 information parity with the AI: aggregate MEASURED coverage each
# second + the nominal model + its own flight). See baselines.B6Measured. Tuned on design seeds 10000-10009 x cells
# mm_none, mm_bl25, mm_s8_c50, mm_h4 (16 variants, mismatch_exp.py tune; never val), then FROZEN at the best mean:
# k 3, dwell 2 s, no altitude probes, steps [50, 25] (0.8489 vs B6 0.8468 on the same; table in room.md).
b6meas:
  k: 3                          # nominal top-k spots surveyed (tuned over {3, 5})
  min_sep_m: 300                # the k spots are at least this far apart horizontally
  dwell_s: 2                    # seconds measured at each surveyed spot (tuned over {2, 10})
  probe_dwell_s: 2              # seconds measured at each pattern-search probe
  steps_m: [50, 25]             # probe distances of the measured pattern search; null = refine.steps_m (tuned over
                                # {[100, 50, 25], [50, 25]})
  alt_probes: false             # pattern search also probes altitude +/- step/2 (tuned over {false, true})
  improve_min: 0.002            # a probe must beat the centre's measured coverage by this much to be kept
  recheck_s: 30                 # on station: every recheck_s compare the measured coverage with the committed one ...
  recheck_drop: 0.05            # ... and restart (nominal re-plan + survey) if it fell by more than this
  arrive_tol_m: 0.5             # arrived = within this distance horizontally and vertically
  max_leg_s: 120                # give up a leg after this long (never happens on the 2 km map at 15 m/s)

# small-scale fading (Phase 4). Off = average channel (deterministic baselines, dataset sweep).
fading:
  enabled: false
  rician_k_db: 10.0             # ENGINEERING ASSUMPTION: LoS link K-factor; NLoS links use Rayleigh

# NOMA
noma_alpha_weak: 0.8            # power share of the weak user (strong gets 0.2)
pairing: extreme                # extreme (strongest with weakest) | random

# QoS-aware access (book 14.6 step 2), used only when env.access is oma_opt or noma_opt (make_dataset.access_rates).
# Every admitted user gets just its class's min rate at minimum power; the cheapest users are admitted first.
access:
  sic_eps: 0.0                  # ENGINEERING ASSUMPTION: imperfect-SIC residual (share of the weak user's power the
                                # strong user cannot remove); 0 = perfect SIC; sensitivity {0, 0.05}; noma_opt only
  rescue_first: false           # true = admit rescue users first, then the rest (lexicographic); default off

# sweep of drone positions
sweep:
  xy_step_m: 100                # 11 x 11 grid on 1000 m (use 50 for a finer 21 x 21)
  altitudes_m: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 800, 1000]  # plan's h_max is 300-500 m; above that is diagnostic only

# energy: rotary-wing propulsion (Zeng, Xu, Zhang) - VERIFY every value against the paper before citing
energy:
  dt_s: 1.0
  P0_w: 79.86                   # blade profile power in hover
  Pi_w: 88.63                   # induced power in hover  (hover = P0 + Pi = 168.49 W)
  Utip_mps: 120.0               # rotor tip speed
  v0_mps: 4.03                  # mean rotor induced velocity in hover
  d0: 0.6                       # fuselage drag ratio
  rho_kg_m3: 1.225              # air density
  s: 0.05                       # rotor solidity
  A_m2: 0.503                   # rotor disc area
  weight_n: 20.0                # UAV weight (Zeng's value); used for the climbing term
  P_circuit_w: 5.0              # ENGINEERING ASSUMPTION: on-board electronics
  pa_efficiency: 0.4            # ENGINEERING ASSUMPTION: power-amplifier efficiency, comm power = P_tx / this
  battery_wh: 10.0              # small on purpose: ~3.5 min of hover, so the battery binds in a 300 s episode
  # Accelerating / turning flight (OUR EXTENSION, outside Zeng's steady straight-flight model). Used ONLY when
  # uav.a_max_mps2 is set: load factor kappa = sqrt(1 + (a_h/g)^2) from the realised horizontal acceleration a_h,
  # induced power Pi * kappa^1.5 and v0 * sqrt(kappa) (momentum theory with thrust kappa * W).
  accel_power: true             # false = acceleration limit without the energy term (diagnostic only)
  g_mps2: 9.81                  # STANDARD gravity

# UAV limits (spec values; engineering assumptions)
uav:
  v_max_mps: 15.0               # max horizontal speed
  vz_max_mps: 5.0               # max vertical speed
  h_min_m: 50.0
  h_max_m: 300.0                # the sweep goes above this for diagnostics only
  start_h_m: 150.0
  p_max_dbm: 30.0
  # Acceleration limit (plan step 5). null = OFF = the old model (velocity jumps to the command; results bit-exact).
  # When set, the velocity changes by at most a_max * dt per step (vector norm), vertically by az_max * dt, and the
  # accel-energy term above switches on. Value when enabled: 4 (ENGINEERING ASSUMPTION; sensitivity {2, 4, 8}).
  a_max_mps2: null              # horizontal acceleration limit, m/s^2
  az_max_mps2: 3.0              # vertical acceleration limit, m/s^2, used only when a_max_mps2 is set
                                # (ENGINEERING ASSUMPTION; sensitivity {2, 4})

# Stage 5 (roadmap): a simulated quadcopter that really flies (OUR OWN model in plain Python/NumPy: quadsim.py).
# OFF by default: with enabled false (and UAVEnv(dynamics=None)) the env is the old point-mass game, bit for bit.
# On (enabled: true or UAVEnv(dynamics="quad")), every pilot's velocity command becomes the velocity SETPOINT of an
# autopilot (like ArduPilot GUIDED velocity / PX4 offboard velocity) flying a rigid-body quadrotor through each 1 s step.
# Mass = energy.weight_n / energy.g_mps2 = 2.04 kg. Values marked "ArduPilot default" / "PX4 default" are quoted FROM
# MEMORY of those autopilots' parameter lists and are NOT VERIFIED against their documentation. Range = sensitivity range.
quad:
  enabled: false
  dt_s: 0.01                    # integration step, s (100 Hz). ENGINEERING CHOICE; range 0.005-0.02 (test: 0.005 agrees)
  sample_every_s: 0.2           # flight log for the 3D view, s (5 Hz). Display only
  # airframe
  thrust_to_weight: 2.0         # max total thrust / weight. ENGINEERING ASSUMPTION; range 1.5-3
  min_thrust_frac: 0.1          # min total thrust / weight (motors never stop). ENGINEERING ASSUMPTION; range 0-0.2
  arm_m: 0.35                   # centre-to-rotor distance, m: four 0.2 m-radius rotors (total disc area = energy.A_m2,
                                # 0.503 m2) that do not overlap. ENGINEERING ASSUMPTION; range 0.25-0.45
  inertia_kg_m2: [0.03, 0.03, 0.06]   # Ixx, Iyy, Izz: 4 x 0.1 kg motors at arm_m + a compact body.
                                # ENGINEERING ASSUMPTION; range x0.5 - x2
  yaw_torque_m: 0.016           # rotor drag torque per newton of thrust, m. ENGINEERING ASSUMPTION; range 0.01-0.03
  motor_tau_s: 0.05             # first-order lag of thrust and torques, s. ENGINEERING ASSUMPTION; range 0.02-0.1
  drag_lin_n_s_m: 0.2           # rotor (blade-flapping) drag, linear in airspeed, N s/m. ENGINEERING ASSUMPTION;
                                # range 0.05-0.5. The QUADRATIC drag is not a parameter: 0.5 d0 rho s A from `energy:`
                                # (0.0092 N s2/m2), the same fuselage drag as Zeng's parasite power
  # autopilot (cascade: setpoint shaping -> position/velocity PI -> thrust vector + tilt limit -> attitude P -> rate P)
  tilt_max_deg: 30.0            # max tilt, deg. ArduPilot ANGLE_MAX default (30 deg); range 20-45
  rate_max_dps: 220.0           # max body rate, deg/s. PX4 MC_ROLLRATE_MAX default; range 90-360
  ang_p: [4.5, 4.5, 4.5]        # attitude P (roll, pitch, yaw), 1/s. ArduPilot ATC_ANG_RLL/PIT/YAW_P defaults; range 3-9
  rate_ff: true                 # shape the attitude target (sqrt controller, accel-limited) and feed its rate forward.
                                # ArduPilot ATC_RATE_FF_ENAB default (on); false = P-only attitude loop (slower, more
                                # overshoot)
  ang_acc_max_dps2: 1100.0      # attitude-target angular acceleration limit, deg/s2. ArduPilot ATC_ACCEL_R_MAX /
                                # ATC_ACCEL_P_MAX default (110000 cdeg/s2); range 300-1800
  rate_p: 20.0                 # rate-loop bandwidth, 1/s (stands for the rate PID). ENGINEERING ASSUMPTION; range 10-40
  pos_p_xy: 1.0                 # horizontal position P, 1/s. ArduPilot PSC_POSXY_P default; range 0.5-2
  vel_p_xy: 2.0                 # horizontal velocity P, (m/s2)/(m/s). ArduPilot PSC_VELXY_P default; range 1-4
  vel_i_xy: 1.0                 # horizontal velocity I, (m/s2)/m. ArduPilot PSC_VELXY_I default; range 0.2-2
  vel_i_max_xy_mps2: 3.0        # horizontal integrator clamp, m/s2. ENGINEERING ASSUMPTION; range 2-5
  pos_p_z: 1.0                  # vertical position P, 1/s. ArduPilot PSC_POSZ_P default; range 0.5-2
  vel_p_z: 5.0                  # vertical velocity P, (m/s2)/(m/s). ArduPilot PSC_VELZ_P default; range 3-8
  vel_i_z: 2.0                  # vertical velocity I, (m/s2)/m. ENGINEERING ASSUMPTION (ArduPilot integrates in its
                                # vertical acceleration loop instead); range 0.5-4
  vel_i_max_z_mps2: 3.0         # vertical integrator clamp, m/s2. ENGINEERING ASSUMPTION; range 2-5
  leash_xy_m: 10.0              # max distance the shaped target may run ahead horizontally, m. ENGINEERING ASSUMPTION
  leash_z_m: 5.0                # the same vertically, m. ENGINEERING ASSUMPTION
  shape_acc_xy_mps2: 4.0        # setpoint shaping: horizontal acceleration of the target, m/s2. ENGINEERING ASSUMPTION:
                                # = the project's G5 a_max (D-44/D-48); ArduPilot's WPNAV_ACCEL default is 2.5; range 2.5-5
  shape_acc_z_mps2: 3.0         # the same vertically, m/s2 (= uav.az_max_mps2). ENGINEERING ASSUMPTION; range 2-4
  shape_jerk_xy_mps3: 5.0       # setpoint shaping: horizontal jerk limit, m/s3. ArduPilot PSC_JERK_XY default; range 2-20
  shape_jerk_z_mps3: 5.0        # the same vertically, m/s3. ArduPilot PSC_JERK_Z default; range 2-20
  # wind: mean vector + gusts (first-order Gauss-Markov per axis, "Dryden-lite"; seeded per scenario). Default = calm.
  wind:
    mean_mps: 0.0               # mean wind speed, m/s
    dir_deg: 0.0                # direction the wind blows TOWARD, deg counter-clockwise from east
    gust_std_mps: 0.0           # horizontal gust standard deviation, m/s
    gust_std_z_mps: 0.0         # vertical gust standard deviation, m/s
    gust_tau_s: 5.0             # gust correlation time, s. ENGINEERING ASSUMPTION (Dryden L/V at 150 m is ~10-30 s);
                                # range 2-30
  # "wind on" preset (sim-to-sim experiment and the dashboard's wind switch). ENGINEERING ASSUMPTION: a moderate breeze
  # (Beaufort 3, 3.4-5.4 m/s) with turbulence intensity ~0.2; ranges: mean 0-10 m/s, gust std 0.5-2 m/s
  wind_on: {mean_mps: 5.0, dir_deg: 30.0, gust_std_mps: 1.0, gust_std_z_mps: 0.5}

# Gymnasium env (Phase 5)
env:
  grid: 10                      # NxN user-density heatmap
  access: noma                  # noma | oma | oma_opt | noma_opt: how users share the radio (OMA = FDMA, same total
                                # bandwidth and power); *_opt = QoS-aware minimum-power admission (see `access:`)
  reward: v2                    # v1 = coverage;  v2 = coverage - lambda_E * (energy_step / hover_energy_step)
  lambda_energy: 0.05           # ENGINEERING ASSUMPTION
  terminal_penalty: 1.0         # battery empty: reward -= penalty * share of users left uncovered
  # opt-in extras (Track 2); the default observation does not use them
  history_len: 4                # `history` group: the drone's own last 4 (x, y, measured coverage) ...
  history_every_s: 10           # ... taken every 10 s (training passes the decision rhythm hold_steps)
  priv_grid: 20                 # critic-only true-state maps (asymmetric critic): priv_grid x priv_grid

# Baselines (Gate G3). B0 fixed, B1 follow the biggest crowd, B2 weighted k-means, B3 grid search, B4 PSO, B5 energy-aware.
baselines:
  eval_seeds: [0, 99]           # inclusive: 100 scenarios (the plan's G3 minimum)
  altitude_m: 150               # fixed altitude for B0, B1, B2, B3, B5
  power_frac: 1.0               # 1.0 = full power (action +1) for every baseline except B4 (which searches it)
  replan_every_steps: 10        # K: how often B2, B3, B4, B5 recompute their target
  kmeans_k: 3                   # B2: number of clusters
  kmeans_iters: 20
  rescue_weight: 3.0            # B2: a rescue user counts this much more than a normal user
  grid_n: 10                    # B3, B5, B6: grid_n x grid_n candidate positions (100 candidates)
  altitude_levels_m: [50, 100, 150, 200, 300]   # B6: altitudes tried at every grid position
  pso: {particles: 12, iters: 10, inertia: 0.7, c1: 1.5, c2: 1.5}
  energy_aware_margin: 1.0      # B5 moves only if (coverage gain x K) > margin x extra energy cost (in reward units)
  loiter_radius_m: 50           # B7: radius of the loiter circle around B6's target (ENGINEERING ASSUMPTION; {50, 100})
  # B3obs / B3obsU / B3obsUO (information ladder): B3's search, but scored on a pseudo-crowd rebuilt from the maps.
  obs_pseudo_users: 500         # ENGINEERING ASSUMPTION: crowd size they assume (mean of n_users_choices; must be even)

# Value of information (contribution 2, docs/prereg/value_of_info.md; baselines.ReportsView, pilots B6rep / B3rep):
# the planner sees the users only through phone GPS reports. Defaults = full information (B6rep == B6, bit for bit).
# Pilots override these per run, e.g. "B6rep:f=0.2,sigma=10,age=30". Used by no other pilot and no default.
voi:
  f: 1.0                        # share of phones that report (fixed per user and episode); 1/f is assumed known
  sigma_m: 0.0                  # GPS error std per axis, m (2-D Gaussian, a fresh draw per report). ENGINEERING
                                # ASSUMPTION for the scale: consumer GPS ~5-10 m open sky, tens of m in rubble/urban canyons
  age_s: 0                      # reporting interval, s (each phone reports at its own phase, and once on attach)
  rng_stream: 7100              # rng key (scenario, 7100, rep, k): k 0 = who reports, 1 = report phases, 2 = GPS errors

# B6fc, the forecasting greedy pilot (D-52 phase 3; baselines.B6Forecast). Every K steps it scores B6's candidates by
# the mean coverage over [arrival, arrival + window_s] for a FORECAST of the active users (velocity extrapolation from the
# last frame; in announced competing-sites cells also the announced A -> B move). Used by no other pilot and no default.
b6fc:
  window_s: 60                  # D-52 phase 3: score window after arrival (seconds)
  sample_s: 10                  # ENGINEERING CHOICE: forecast samples inside the window (0, 10, ..., 60 s after arrival)
  quantum_s: 5                  # ENGINEERING CHOICE: arrival rounded UP to the next multiple of this (absolute time), so
                                # candidates share forecast times (the oracle's tensor uses the same 5 s grid)
  arrive_tol_m: 0.5             # arrived = within this distance of the target, horizontally and vertically
  screen_top: null              # null = full rule. K = ENGINEERING CHOICE for run time: score every candidate at one
                                # forecast time (mid-window) first, then the full window only for the K best (+ B6's
                                # choice and 'stay'); sites_exp phase 4 sets it (SCREEN_TOP) and reports the agreement

# B6dep, the departure-time planner (baselines.B6Depart; anticipation rule). With an announced event that is not over
# yet, every K steps it scores two-leg plans "stay at B6's choice until departure d, then fly to one of the top_k
# spots for the end of the move" (and "never leave") on one common horizon (now .. episode end) with B6fc's forecast.
# Used by no other pilot and no default.
b6dep:
  top_k: 3                      # reviewer's proposal: the 3 best spots for the end of the move
  depart_every_s: 10            # departure times now, now + 10 s, ... up to t0 + tau (the decision rhythm)
  sample_s: 5                   # ENGINEERING CHOICE: forecast coverage every 5 s of the horizon (the oracle's grid)
  extrap_cap_s: 60              # ENGINEERING CHOICE: velocity extrapolation used for at most 60 s ahead (= b6fc.window_s);
                                # walkers turn inside their site, so a longer straight-line extrapolation is not a forecast

# Clairvoyant oracle (book 14.6 step 3, oracle.py): how much could ANTICIPATION add over the best myopic pilot B6?
# It knows the crowd's future and plans over B6's own candidates (grid_n x grid_n x altitude_levels_m + the start spot).
# Decisions every baselines.replan_every_steps seconds, like B6. Measurement only: never imported by the rl_* code.
oracle:
  sample_every_s: 5             # coverage tensor time step: cov[k, node] at t = 0, 5, ..., 295 s
  horizons_s: [30, 60]          # receding-horizon (MPC) planners: plan this far ahead, execute one move, replan
  frozen_path_horizon_s: 60     # 'frozen_path': path-aware like MPC, but with the users frozen where they are now
  reach_slack: 0.03             # ENGINEERING CHOICE: the planner flies 3% faster than v_max, because the grid spacing
                                # (2000/13 = 153.8 m on `hard`) is just above v_max x 10 s = 150 m; a 1-cell hop really
                                # takes 10.26 s (the replay flies the true speed)
  max_hop_decisions: null       # longest straight flight, in decisions; null = no limit (the planner can fly anywhere
                                # straight, like B6 does; limiting it to 1-2 cells made the oracle slower than B6)
  windows_s: [[0, 60], [60, 180], [180, 300]]   # report per time window (surges / hotspot jumps start 60-180 s)
  min_gain: 0.02                # PRE-REGISTERED decision rule: dp - B6 below this for every mobility model ->
                                # "no room for anticipation in these regimes; redesign scenarios before G5"

# Named profiles = overrides of the settings above. Select with UAV_PROFILE=<name> or `--profile <name>`.
# They exist because in the default scenarios a fixed drone already covers 88% of users, which leaves RL little to gain.
# All values are engineering choices. Nothing here changes the default dataset.
profiles:
  lowpower:                      # weaker transmitter: position and altitude matter more
    uav: {p_max_dbm: 20}
  bigarea:                       # 2 x 2 km (the plan's out-of-distribution size): the centre no longer covers everyone
    area_m: 2000
  rl_static:                     # RL curriculum step 1: as hard as `hard`, but the crowd stands still
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [static]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
  rl_static_g20:                 # same scenarios as rl_static, but the agent's map is 20 x 20 instead of 10 x 10
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [static]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
    env: {grid: 20}
  hard:                          # everything at once, plus dynamic-only mobility models and a battery that can last
    area_m: 2000
    uav: {p_max_dbm: 20}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [hotspot_jump, surge, group_drift, attraction]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}      # keep the grid spacing about the same on the bigger map
  # Competing sites (D-52, pre-registered): `hard`'s map, power, obstacles and grid, the `sites` crowd (section `sites:`
  # above) and the owner's G5 settings (D-48: adaptive NOMA with imperfect SIC 0.05 and rescue first, acceleration limit
  # 4 m/s^2 with the turning-energy term). sites_base = D 1.5 km, tau 60 s. The design-grid cells sites_d<D>_t<tau>
  # change only the A-B distance and the ramp. The announced/unannounced variants differ only in `sites.announced`,
  # which feeds the (opt-in) event_countdown observation, so they are not separate profiles here.
  sites_base: &sites
    area_m: 2000
    uav: {p_max_dbm: 20, a_max_mps2: 4}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [sites]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
    env: {access: noma_opt}
    access: {sic_eps: 0.05, rescue_first: true}
  sites_d10_t0: {<<: *sites, sites: {distance_m: 1000, tau_s: 0}}
  sites_d10_t60: {<<: *sites, sites: {distance_m: 1000, tau_s: 60}}
  sites_d10_t180: {<<: *sites, sites: {distance_m: 1000, tau_s: 180}}
  sites_d15_t0: {<<: *sites, sites: {distance_m: 1500, tau_s: 0}}
  sites_d15_t60: {<<: *sites, sites: {distance_m: 1500, tau_s: 60}}
  sites_d15_t180: {<<: *sites, sites: {distance_m: 1500, tau_s: 180}}
  sites_d20_t0: {<<: *sites, sites: {distance_m: 2000, tau_s: 0}}
  sites_d20_t60: {<<: *sites, sites: {distance_m: 2000, tau_s: 60}}
  sites_d20_t180: {<<: *sites, sites: {distance_m: 2000, tau_s: 180}}
  # Anticipation rule (pre-registered test cells, docs/prereg/anticipation_rule.md; anticip_exp.py): sites_base with
  # ONE more thing changed each: the drone's top speed (v8 / v25 m/s), the episode length (T600: 600 s, event start
  # range scaled x2), or an off-grid distance / ramp. Batteries are ENGINEERING CHOICES so that every pilot lasts the
  # episode (the headroom is energy-free by design, as in D-52): 24 Wh at 25 m/s (fast flight costs more than
  # hovering), 40 Wh for 600 s (hover alone needs ~29 Wh).
  sites_v8_d15_t60: {<<: *sites, uav: {p_max_dbm: 20, a_max_mps2: 4, v_max_mps: 8}, sites: {distance_m: 1500, tau_s: 60}}
  sites_v25_d15_t60: {<<: *sites, uav: {p_max_dbm: 20, a_max_mps2: 4, v_max_mps: 25}, energy: {battery_wh: 24},
                      sites: {distance_m: 1500, tau_s: 60}}
  sites_v8_d20_t0: {<<: *sites, uav: {p_max_dbm: 20, a_max_mps2: 4, v_max_mps: 8}, sites: {distance_m: 2000, tau_s: 0}}
  sites_v25_d20_t0: {<<: *sites, uav: {p_max_dbm: 20, a_max_mps2: 4, v_max_mps: 25}, energy: {battery_wh: 24},
                     sites: {distance_m: 2000, tau_s: 0}}
  sites_T600_d20_t0: {<<: *sites, mobility: {choices: [sites], episode_steps: 600}, energy: {battery_wh: 40},
                      sites: {distance_m: 2000, tau_s: 0, t0_range_s: [120, 300]}}
  sites_T600_d15_t60: {<<: *sites, mobility: {choices: [sites], episode_steps: 600}, energy: {battery_wh: 40},
                       sites: {distance_m: 1500, tau_s: 60, t0_range_s: [120, 300]}}
  sites_d175_t30: {<<: *sites, sites: {distance_m: 1750, tau_s: 30}}
  sites_d125_t120: {<<: *sites, sites: {distance_m: 1250, tau_s: 120}}
  # G5 training cells with the ANNOUNCED schedule (owner, D-54): the AI sees event_countdown + event_announce
  sites_d20_t0_ann: {<<: *sites, sites: {distance_m: 2000, tau_s: 0, announced: true}}
  sites_d20_t60_ann: {<<: *sites, sites: {distance_m: 2000, tau_s: 60, announced: true}}
  # Model mismatch (results/mismatch/): `rl_static` (still crowds) with the owner's G5 settings (D-48), and one
  # perturbation type per cell. mm_s<sigma>_c<corr> = user-side shadowing; mm_bl25 = true building loss 25 dB (planner
  # 15); mm_h<n> = n hidden buildings; mm_none = no mismatch (negative control). mm_hard_* = the same on `hard`
  # (robustness check only).
  mm_none: &mm
    area_m: 2000
    uav: {p_max_dbm: 20, a_max_mps2: 4}
    obstacles: {n_range: [3, 8], size_range_m: [60, 200]}
    mobility: {choices: [static]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
    env: {access: noma_opt}
    access: {sic_eps: 0.05, rescue_first: true}
  mm_s4_c25: {<<: *mm, mismatch: {shadow_sigma_db: 4, shadow_corr_m: 25}}
  mm_s4_c50: {<<: *mm, mismatch: {shadow_sigma_db: 4, shadow_corr_m: 50}}
  mm_s4_c150: {<<: *mm, mismatch: {shadow_sigma_db: 4, shadow_corr_m: 150}}
  mm_s8_c25: {<<: *mm, mismatch: {shadow_sigma_db: 8, shadow_corr_m: 25}}
  mm_s8_c50: {<<: *mm, mismatch: {shadow_sigma_db: 8, shadow_corr_m: 50}}
  mm_s8_c150: {<<: *mm, mismatch: {shadow_sigma_db: 8, shadow_corr_m: 150}}
  mm_bl25: {<<: *mm, mismatch: {excess_loss_db: 25}}
  mm_h2: {<<: *mm, mismatch: {hidden_obstacles: 2}}
  mm_h4: {<<: *mm, mismatch: {hidden_obstacles: 4}}
  # EXPLORATORY (added after the room test found no passing cell; not in the pre-registered grid): a larger dose
  mm_h8: {<<: *mm, mismatch: {hidden_obstacles: 8}}
  mm_combo: {<<: *mm, mismatch: {shadow_sigma_db: 8, shadow_corr_m: 150, excess_loss_db: 25, hidden_obstacles: 4}}
  mm_hard_none: &mmh
    <<: *mm
    mobility: {choices: [hotspot_jump, surge, group_drift, attraction]}

  # Real-place case study (docs/case_nepal/): Kathmandu, Bagmati floods (a scenario based on Sept 2024), OSM buildings
  # as height-aware obstacles, the reconstructed flood crowd (section `place:`) and the owner's G5 settings (D-48).
  place_kathmandu_bagmati:
    area_m: 2000
    uav: {p_max_dbm: 20, a_max_mps2: 4}
    mobility: {choices: [place]}
    energy: {battery_wh: 16}
    baselines: {grid_n: 14}
    env: {access: noma_opt}
    access: {sic_eps: 0.05, rescue_first: true}
    place: {name: kathmandu_bagmati}

# Reinforcement learning (Gate G4). Train on the training seeds only; pick models on val; touch test once at the end.
rl:
  algo: PPO
  profile: rl_static             # which scenario profile to train on
  hold_steps: 10                 # the agent decides once every 10 s (like the baselines)
  controls: goto                 # curriculum: goto (where to fly) -> gotoz (+ altitude) -> gotozp (+ power); xy/xyz/xyzp = velocity versions
                                 # moveby/movebyz/movebyzp = "move this far" versions (offset from the drone; 0 = stay), for G5
  moveby_radius_m: null          # largest move per decision; null = v_max x hold_steps (150 m at 15 m/s, 10 s). ENGINEERING CHOICE
  reward: v1                     # v1 = coverage only; v2 adds the energy cost (curriculum step 5)
  seed: 0
  total_timesteps: 100000        # agent DECISIONS (each held hold_steps seconds): 100k decisions = 1M seconds
  n_envs: 4
  n_steps: 256                   # decisions per env per update
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995                   # kept from the 1-step setup; with hold_steps 10 a game is only 30 decisions (book 14.5)
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
  policy: mlp                    # mlp = plain network on the observation | cnn = reads the two maps as a picture
  obs_groups: [pos, vel, battery, time, prev, heat_all, heat_rescue]   # what the agent sees (all = 211 numbers)
  std_end: null                  # if a number, the exploration noise shrinks linearly from exp(log_std_init) to it (e.g. 0.05)
  log_std_init: -1.0             # start with action noise of about 0.37 (SB3 default 0 = 1.0, too noisy here)
  norm_reward: true              # scale rewards (returns are ~150): standard for PPO value learning
  val_eval_every_steps: 20000    # (decisions) print a deterministic score on the first val scenarios during training
  val_eval_scenarios: 8
  checkpoint_every_steps: 10000
  out_dir: results/rl
  # Track 2 (all opt-in; the values below keep the old behaviour)
  obs_mode: box                  # box = flat vector (old) | dict = maps + scalars as a gymnasium Dict (needed for priv)
  privileged: false              # SAC only: asymmetric critic. The critic (training only, discarded) also sees the true
                                 # state (uncapped 20x20 density, rescue, obstacle, demand maps, crowd size); the actor never
  train_seed_range: null         # null = the training split (0-99); e.g. [10000, 19999] = 10,000 fresh procedural scenarios
  torch_threads: 2               # the laptop is shared: keep PyTorch to 2 CPU threads
  sac:                           # used when algo: SAC
    learning_rate: 0.0003
    buffer_size: 50000           # decisions; the Dict replay buffer stores obs and next_obs (RAM is tight on this laptop)
    learning_starts: 2000
    batch_size: 256
    tau: 0.005
    train_freq: 1                # one gradient step per vector-env step (= per n_envs decisions)
    gradient_steps: 1
    ent_coef: auto
    net_arch: [256, 256]

# Hybrid timing AI (owner-approved; hybrid.py, hybrid_train.py, pre-registration docs/prereg/hybrid_timing.md).
# B6 decides WHERE, a small PPO policy decides only WHEN to leave for the announced destination (Discrete(2) every
# baselines.replan_every_steps). Used by nothing else; excluded from the oracle's and the hybrid's cache keys.
hybrid:
  obs_groups: [pos, vel, battery, time, prev, crowd_n, history, event_countdown, event_announce, heat_all_u,
               heat_rescue_u]   # the G5 observation (raw groups + the announcement, D-54)
  train_seeds: [10000, 10199]   # FIXED training pool (fresh procedural scenarios, disjoint from val/test)
  timesteps: 100000             # decisions per training run (Round A, pre-registered)
  train_seeds_per_cell: 3       # Round A: PPO training seeds 0..2 (seeds 3, 4 only if Round A beats the bar)
  gamma: 0.95
  ent_coef: 0.01                # ENGINEERING CHOICE: keeps the binary choice exploring early (categorical head)
  net_arch: [64, 64]
  n_envs: 4
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gae_lambda: 0.95
  clip_range: 0.2
  checkpoint_every: 25000       # decisions; checkpoints are for crash recovery only (the FINAL model is evaluated)
